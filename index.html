<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Search:</h2>
        
        <!-- Пошуку -->
        <form id="searchForm" class="search-form">
            <div class="form-group">
                <label for="titleInput">Title:</label>
                <input type="text" id="titleInput" required>
            </div>
            <div class="form-group">
                <label for="typeSelect">Type:</label>
                <select id="typeSelect">
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                    <option value="episode">Episode</option>
                </select>
            </div>
            <button type="submit" class="search-btn">Search</button>
        </form>

        <!-- Блок зі списком фільмів та пагінацією (схований за замовчуванням) -->
        <div id="filmsSection" class="hidden">
            <h2>Films:</h2>
            <div id="filmsContainer" class="films-container"></div>
            <div id="paginationContainer" class="pagination-container"></div>
        </div>

        <!-- Блок з детальною інформацією (схований за замовчуванням) -->
        <div id="detailsSection" class="hidden">
            <h2>Film info:</h2>
            <div id="detailsContainer" class="details-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
